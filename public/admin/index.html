<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>THREADS Admin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1c1d20">
  <link rel="icon" href="/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <!-- Login -->
  <div class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <img src="/brand/logo-white.png" alt="THREADS" class="login-logo">
      <p class="login-sub">Store admin</p>
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
      <div class="login-err" id="loginErr"></div>
      <button class="btn btn-green btn-block" type="submit">Sign in</button>
    </form>
  </div>

  <div class="shell" id="shell" hidden>
    <aside class="side" id="side">
      <a href="/admin" class="side-logo" data-nav="home"><img src="/brand/logo-white.png" alt="THREADS"></a>
      <nav class="side-nav">
        <a data-nav="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Home</a>
        <a data-nav="orders"><svg viewBox="0 0 24 24"><path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 9h6M9 13h6"/></svg>Orders <span class="badge" id="pendingBadge" hidden></span></a>
        <a data-nav="products"><svg viewBox="0 0 24 24"><path d="M8 4l-4 3 2 4 2-1v10h8V10l2 1 2-4-4-3a4 4 0 0 1-8 0z"/></svg>Products</a>
        <a data-nav="homepage"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="16" cy="8.5" r="1.5"/></svg>Homepage</a>
        <a data-nav="import"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></svg>Excel import</a>
        <a data-nav="community"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="10" r="2.4"/><path d="M15.5 14.6A4.5 4.5 0 0 1 21 19"/></svg>Community</a>
        <a data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>Settings</a>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank" class="view-store"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>View store</a>
        <button id="logout" class="logout">Sign out</button>
      </div>
    </aside>
    <div class="main">
      <header class="mtop">
        <button class="icon-btn" id="sideToggle" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <img src="/brand/logo-white.png" alt="THREADS" class="mtop-logo">
        <a href="/" target="_blank" class="icon-btn" aria-label="View store"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
      </header>
      <div class="content" id="view"></div>
    </div>
  </div>

  <!-- slide-over panel -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet" id="sheet" aria-hidden="true"></aside>

  <div class="toast" id="toast"></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
