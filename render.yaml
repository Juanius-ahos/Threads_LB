# One-click deploy on Render (render.com → New → Blueprint → pick this repo).
# The disk keeps the database and uploaded photos between deploys.
services:
  - type: web
    name: threads-store
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: threads-data
      mountPath: /var/data
      sizeGB: 1
